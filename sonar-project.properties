# SonarCloud. organization y projectKey se pasan desde el workflow
# (variables de repositorio SONAR_ORGANIZATION y SONAR_PROJECT_KEY).
sonar.sourceEncoding=UTF-8

# Código fuente de ambos proyectos
sonar.sources=BACKEND/src,FRONTEND/src
sonar.tests=BACKEND/tests
sonar.test.inclusions=BACKEND/tests/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,BACKEND/sql/**,BACKEND/src/openapi.json

# Cobertura generada por `node --test` (reporter lcov) en el job backend
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info
